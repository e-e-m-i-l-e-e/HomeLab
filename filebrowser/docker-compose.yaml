services:
  filebrowser:
    image: gtstef/filebrowser:latest
    container_name: filebrowser
    ports:
      - "8080:80"
    volumes:
      - root:/srv
      - data:/home/filebrowser/data
    user: "0:0"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8081:80"
    volumes:
      - root:/srv:ro
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
            listen 80;
            server_name _;

            root /srv/static;
            index index.html;

            location / {
                try_files $$uri $$uri/ =404;
            }
        }
        EOF

        nginx -g 'daemon off;'
    restart: unless-stopped

volumes:
  data:
  root: