services:
  teamcity-server:
    image: artifactory.lab.eemilee.me/docker/teamcity:2026.1.3
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-vm2
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.teamcity.entrypoints=web"
        - "traefik.http.routers.teamcity.rule=Host(`teamcity.lab.eemilee.me`)"
        - "traefik.http.services.teamcity.loadbalancer.server.port=8111"
    environment:
      - TEAMCITY_DB_URL=jdbc:postgresql://postgres:5432/teamcity
      - TEAMCITY_DB_USER=teamcity
      - TEAMCITY_DB_PASSWORD_FILE=/run/secrets/teamcity-db-password
      - TEAMCITY_SERVER_MEM_OPTS=-Xmx1024m -Xms512m
    command:
      - /bin/bash
      - -c
      - |
        export TEAMCITY_DB_PASSWORD="$$(cat /run/secrets/teamcity-db-password | tr -d '\n')"
        exec /run-services.sh
    secrets:
      - teamcity-db-password
    volumes:
      - data:/data/teamcity_server/datadir
    networks:
      - local
      - reverse-proxy
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == docker-master
    environment:
      - POSTGRES_DB=teamcity
      - POSTGRES_USER=teamcity
      - POSTGRES_PASSWORD_FILE=/run/secrets/teamcity-db-password
    secrets:
      - teamcity-db-password
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamcity -d teamcity"]
      interval: 10s
      timeout: 5s
      retries: 5

  teamcity-agent:
    image: jetbrains/teamcity-agent:2026.1.3-linux-sudo
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == docker-vm2
    environment:
      - AGENT_NAME=docker-vm2
      - SERVER_URL=http://teamcity-server:8111
    volumes:
      - agent:/data/teamcity_agent/conf
    networks:
      - local

volumes:
  db:
  data:
  agent:

networks:
  local:
    driver: overlay
  reverse-proxy:
    external: true

secrets:
  teamcity-db-password:
    external: true