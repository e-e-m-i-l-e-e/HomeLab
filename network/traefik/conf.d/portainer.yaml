http:
  routers:
    portainer:
      rule: "Host(`portainer.lab.eemilee.me`)"
      entryPoints:
        - websecure
      service: portainer
      tls:
        certResolver: letsencrypt

  services:
    portainer:
      loadBalancer:
        servers:
          - url: "http://192.168.0.121:9000"
        serversTransport: portainerTransport

  serversTransports:
    portainerTransport:
      insecureSkipVerify: true