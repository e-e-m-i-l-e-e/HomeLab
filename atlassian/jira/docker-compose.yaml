services:
  postgres:
    image: postgres:latest
    container_name: jira_postgres
    environment:
      POSTGRES_DB: jira
      POSTGRES_USER: jira
      POSTGRES_PASSWORD: password
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "5432:5432"
#    volumes:
#      - jira_postgres:/var/lib/postgresql/data
    networks:
      jira-network:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U jira -d jira" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  jira:
    image: jira:latest
    container_name: jira
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
#    volumes:
#      - jira:/var/atlassian/application-data/jira
    networks:
      jira-network:
    environment:
      - ATL_JDBC_URL=jdbc:postgresql://postgres:5432/jira
      - ATL_DB_DRIVER=org.postgresql.Driver
      - ATL_DB_TYPE=postgres72
      - ATL_JDBC_USER=jira
      - ATL_JDBC_PASSWORD=password
    restart: unless-stopped

networks:
  jira-network:

