services:
  confluence:
    image: artifactory.lab.eemilee.me/docker/confluence:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-vm2
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.confluence.entrypoints=web"
        - "traefik.http.services.confluence.loadbalancer.server.port=8090"
        - "traefik.http.routers.confluence.rule=Host(`confluence.lab.eemilee.me`)"
    environment:
      - ATL_JDBC_URL=jdbc:postgresql://postgres:5432/confluence
      - ATL_DB_TYPE=postgresql
      - ATL_JDBC_USER=confluence
      - ATL_JDBC_PASSWORD=password
      - ATL_PROXY_NAME=confluence.lab.eemilee.me
      - ATL_PROXY_PORT=443
      - ATL_TOMCAT_SCHEME=https
      - ATL_TOMCAT_PORT=8090
    volumes:
      - home:/var/atlassian/application-data/confluence
    networks:
      - local
      - reverse-proxy
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == docker-master
    environment:
      - POSTGRES_DB=confluence
      - POSTGRES_USER=confluence
      - POSTGRES_PASSWORD_FILE=/run/secrets/confluence-db-password
    secrets:
      - confluence-db-password
    volumes:
      - db:/var/lib/postgresql
    networks:
      local:
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U confluence -d confluence" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

networks:
  local:
    driver: overlay
  reverse-proxy:
    external: true

volumes:
  db:
  home:

secrets:
  confluence-db-password:
    external: true