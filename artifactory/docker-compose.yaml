services:
  jfrog-artifactory:
    image: emilyyy0621/jfrog-artifactory:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.hostname == docker-vm1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.artifactory.entrypoints=web"
        - "traefik.http.services.artifactory.loadbalancer.server.port=8082"
        - "traefik.http.routers.artifactory.rule=Host(`artifactory.lab.eemilee.me`)"
    environment:
      - SKIP_WAIT_FOR_EXTERNAL_DB=true
    volumes:
      - home:/var/opt/jfrog/artifactory
    networks:
      - local
      - reverse-proxy
    depends_on:
      - postgres

  postgres:
    image: releases-docker.jfrog.io/postgres:17.6-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.hostname == docker-master
    environment:
      - POSTGRES_DB=artifactory
      - POSTGRES_USER=artifactory
      - POSTGRES_PASSWORD_FILE=/run/secrets/artifactory-db-password
    secrets:
      - artifactory-db-password
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      local:

volumes:
  db:
  home:

networks:
  local:
    driver: overlay
  reverse-proxy:
    external: true

secrets:
  artifactory-db-password:
    external: true