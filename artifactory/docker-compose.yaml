services:
  jfrog-artifactory:
    image: emilyyy0621/jfrog-artifactory:latest
    container_name: jfrog-artifactory
    environment:
      - SKIP_WAIT_FOR_EXTERNAL_DB=true
    ports:
      - "8082:8082"
    volumes:
      - artifactory-data:/var/opt/jfrog/artifactory
    networks:
      artifactory-network:
    depends_on:
      - postgres
    restart: unless-stopped

  postgres:
    image: releases-docker.jfrog.io/postgres:17.6-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=artifactory
      - POSTGRES_USER=artifactory
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      artifactory-network:
    restart: always

volumes:
  postgres-data:
  artifactory-data:

networks:
  artifactory-network: